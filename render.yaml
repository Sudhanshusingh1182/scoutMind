services:
  # ── Backend (FastAPI) ──
  - type: web
    name: scoutmind-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: BACKEND_HOST
        value: 0.0.0.0
      - key: BACKEND_PORT
        value: 8000
      - key: LLM_PLANNER
        value: openrouter
      - key: LLM_INSIGHTS
        value: openrouter
      - key: LLM_OPPORTUNITIES
        value: openrouter
      - key: LLM_STARTUPS
        value: openrouter
      - key: LLM_REPORT
        value: openrouter
    healthCheckPath: /health
    autoDeploy: true

  # ── Frontend (Next.js) ──
  - type: web
    name: scoutmind-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    buildArgs:
      NEXT_PUBLIC_API_URL: https://scoutmind-backend.onrender.com
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: 1040621167690-u4281r0jkkbngndqncsor6cb9cg06sqo.apps.googleusercontent.com
    autoDeploy: true
